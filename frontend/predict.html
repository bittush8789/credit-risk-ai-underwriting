<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Predictor V4 - CreditRisk AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🏦 CreditRisk AI <span style="font-size: 0.6rem; vertical-align: super; background: #2563eb; color: white; padding: 2px 4px; border-radius: 4px;">V4 PRO</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="predict.html" class="active">Predict</a></li>
            <li><a href="metrics.html">Metrics</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>
    <div class="container">
        <h2 class="page-title">Advanced Credit Underwriting</h2>
        <form id="predictForm" class="prediction-form" autocomplete="off">
            <div class="form-grid">
                <!-- Personal -->
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="e.g. 30" required>
                </div>
                <div class="form-group">
                    <label>Employment Years</label>
                    <input type="number" id="employment_years" placeholder="e.g. 5" required>
                </div>
                <div class="form-group">
                    <label>Dependents</label>
                    <input type="number" id="dependents" placeholder="e.g. 0" required>
                </div>
                
                <!-- Financial -->
                <div class="form-group">
                    <label>Annual Income ($)</label>
                    <input type="number" id="annual_income" placeholder="e.g. 60000" required>
                </div>
                <div class="form-group">
                    <label>Monthly Expenses ($)</label>
                    <input type="number" id="monthly_expenses" placeholder="e.g. 2000" required>
                </div>
                <div class="form-group">
                    <label>Savings Balance ($)</label>
                    <input type="number" id="savings_balance" placeholder="e.g. 15000" required>
                </div>

                <!-- Loan Details -->
                <div class="form-group">
                    <label>Loan Amount ($)</label>
                    <input type="number" id="loan_amount" placeholder="e.g. 10000" required>
                </div>
                <div class="form-group">
                    <label>Loan Purpose</label>
                    <select id="loan_purpose">
                        <option value="" disabled selected>Select Purpose</option>
                        <option value="Home">Home</option>
                        <option value="Education">Education</option>
                        <option value="Personal">Personal</option>
                        <option value="Business">Business</option>
                        <option value="Auto">Auto</option>
                        <option value="Debt Consolidation">Debt Consolidation</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Residence Type</label>
                    <select id="residence_type">
                        <option value="" disabled selected>Select Residence</option>
                        <option value="Owned">Owned</option>
                        <option value="Rented">Rented</option>
                        <option value="Mortgaged">Mortgaged</option>
                    </select>
                </div>

                <!-- Credit Profile -->
                <div class="form-group">
                    <label>Credit Score (300-850)</label>
                    <input type="number" id="credit_score" placeholder="e.g. 700" required>
                </div>
                <div class="form-group">
                    <label>Current Debt ($)</label>
                    <input type="number" id="total_debt" placeholder="e.g. 2000" required>
                </div>
                <div class="form-group">
                    <label>Active Loans</label>
                    <input type="number" id="active_loans" placeholder="e.g. 1" required>
                </div>
                <div class="form-group">
                    <label>Delayed Payments</label>
                    <input type="number" id="delayed_payments" placeholder="e.g. 0" required>
                </div>
            </div>
            <button type="submit" class="btn primary">Execute Intelligence Engine</button>
        </form>

        <div id="resultCard" class="result-card">
            <h3>Underwriting Decision</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                <div>
                    <p><strong>Risk Level:</strong> <span id="riskLevel"></span></p>
                    <p><strong>Recommendation:</strong> <span id="recommendation" style="font-weight: 700;"></span></p>
                </div>
                <div style="text-align: right;">
                    <p><strong>Approval Score:</strong> <span id="approvalChance"></span>%</p>
                    <p><strong>Confidence:</strong> <span id="confidenceScore"></span>%</p>
                </div>
            </div>

            <div id="financialRatiosArea" style="margin-top: 1rem; padding: 1rem; background: #f8fafc; border-radius: 4px; display: none;">
                <div style="display: flex; justify-content: space-between;">
                    <strong>Debt-to-Income (DTI):</strong> <span id="ratioDTI">--</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <strong>Savings-to-Debt:</strong> <span id="ratioSTD">--</span>
                </div>
            </div>
            
            <div id="riskReasonsArea" style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #cbd5e1; display: none;">
                <strong>Key Risk Factors:</strong>
                <ul id="riskReasonsList" style="margin-top: 0.5rem; color: #475569; font-size: 0.9rem;"></ul>
            </div>

            <div style="margin-top: 1.5rem;">
                <a id="downloadReport" href="#" class="btn secondary" style="display: none; text-align: center; text-decoration: none;">📥 Download PDF Underwriting Report</a>
            </div>
        </div>
    </div>
    <script src="js/predict.js"></script>
</body>
</html>
