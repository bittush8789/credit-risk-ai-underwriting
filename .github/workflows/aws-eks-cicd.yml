name: AWS EKS + KServe CI/CD Pipeline

on:
  push:
    branches: [cicd-mlops]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run unit tests
        run: |
          pip install pytest
          pytest tests

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Scan Dockerfile
        run: |
          trivy image --severity HIGH,CRITICAL credit-risk-backend:latest || true

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: security-scan
    env:
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:latest -f Dockerfile .
      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REPOSITORY:latest

  train-and-upload-model:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install training deps
        run: pip install -r requirements.txt
      - name: Run training script
        run: |
          python training/train.py
      - name: Upload model to S3
        run: |
          aws s3 cp models/credit_risk_model.pkl s3://$S3_BUCKET/models/$(date +%Y%m%d%H%M%S)/credit_risk_model.pkl

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: train-and-upload-model
    env:
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'
      - name: Deploy namespace & serviceaccount
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccount.yaml
      - name: Deploy FastAPI Backend
        run: |
          # Substitute image tag in deployment manifest
          sed -i "s|image:.*|image: ${{ secrets.ECR_REPOSITORY }}:latest|g" k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-deployment.yaml
      - name: Deploy KServe InferenceService
        run: |
          # Update storageUri to latest model location
          LATEST_MODEL=$(aws s3 ls s3://$S3_BUCKET/models/ | sort | tail -n 1 | awk '{print $4}')
          sed -i "s|storageUri:.*|storageUri: s3://$S3_BUCKET/models/$LATEST_MODEL|g" kserve/inference-prod.yaml
          kubectl apply -f kserve/inference-prod.yaml
      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/credit-risk-backend -n credit-risk-prod
          kubectl get inferenceservice credit-risk-predictor -n credit-risk-model -o yaml
      - name: Smoke test health endpoint
        run: |
          ENDPOINT=$(kubectl get svc credit-risk-backend -n credit-risk-prod -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -s http://$ENDPOINT/health

# End of pipeline
