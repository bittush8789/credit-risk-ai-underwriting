name: MLOps Pipeline

on:
  push:
    branches: [cicd]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: credit-risk-bucket

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate Synthetic Data
        run: python src/generate_data.py

      - name: Train Model
        run: python src/train.py

      - name: Evaluate Model
        run: python src/evaluate.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Model to S3
        run: |
          aws s3 cp models/credit_risk_model.pkl s3://${{ env.S3_BUCKET }}/models/credit_risk_model.pkl
          aws s3 cp models/scaler.pkl s3://${{ env.S3_BUCKET }}/models/scaler.pkl

      - name: Update KServe Inference Manifest
        run: |
          # Use a timestamp or hash to force ArgoCD sync if necessary, 
          # though S3 URI change is the primary trigger
          sed -i "s|storageUri:.*|storageUri: s3://${{ env.S3_BUCKET }}/models/credit_risk_model.pkl|g" k8s/inference.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add k8s/inference.yaml
          git commit -m "Automated model update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin cicd
